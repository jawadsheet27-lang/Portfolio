<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XARV Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0c'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='36' font-style='italic' fill='%23c6a66b' text-anchor='middle'%3EX%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#0b0b0c;--ink2:#121214;--ink3:#181816;--paper:#f2eee7;--gold:#c6a66b;--gold2:#e4d0a2;--muted:#a29e97;--line:rgba(255,255,255,.14);--ok:#72BC8F;--err:#E97366}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif;line-height:1.5;min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:14px}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
[dir="rtl"]{font-family:'Noto Sans Arabic',Arial,sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--paper);font-weight:700;font-size:13px;text-decoration:none;transition:border-color .2s,color .2s,background .2s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#17140f}
.btn.gold:hover{background:var(--gold2);border-color:var(--gold2);color:#17140f}
.btn.sm{min-height:34px;padding:0 13px;font-size:12px}
.btn:disabled{opacity:.45;pointer-events:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(400px,100%);border:1px solid var(--line);border-radius:18px;background:var(--ink2);padding:38px 32px}
.login-card .logo{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);margin-bottom:18px;object-fit:cover}
.login-card h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px}
.login-card p{color:var(--muted);font-size:13.5px;margin:0 0 24px}
.login-card .fld{margin-bottom:16px}
.login-err{color:var(--err);font-size:13px;margin:12px 0 0;min-height:18px}
.login-note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6;border-top:1px solid var(--line);padding-top:16px}

/* editor */
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .wm{font-weight:800;letter-spacing:.16em;font-size:14px;color:var(--gold)}
.topbar .dot{font-size:12px;color:var(--muted)}
.topbar .dot.dirty{color:var(--gold2)}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1180px;margin:0 auto;padding:12px 24px 0;scrollbar-width:thin}
.tab{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;white-space:nowrap}
.tab:hover{color:var(--paper)}
.tab.on{background:var(--ink3);border-color:var(--line);color:var(--gold2)}
.pane{max-width:1180px;margin:0 auto;padding:28px 24px 140px}
.sec{border:1px solid var(--line);border-radius:16px;background:var(--ink2);padding:24px;margin-bottom:18px}
.sec > h2{font-size:16px;letter-spacing:-.01em;margin:0 0 4px}
.sec > .hint{color:var(--muted);font-size:12.5px;margin:0 0 18px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.ar-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.ar-row{grid-template-columns:1fr}}
.ar-row .col-l{position:relative}
.ar-row .tag{position:absolute;top:-7px;inset-inline-start:10px;background:var(--ink2);padding:0 6px;font-size:10px;letter-spacing:.12em;color:var(--gold);font-weight:800}
.item{border:1px solid var(--line);border-radius:14px;background:var(--ink);padding:18px;margin-bottom:14px}
.item-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.item-head .t{font-size:13px;font-weight:700;color:var(--gold2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-head .acts{display:flex;gap:6px}
.mini{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;display:grid;place-items:center}
.mini:hover{border-color:var(--gold);color:var(--gold2)}
.mini.danger:hover{border-color:var(--err);color:var(--err)}
.add-btn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:12px;font-size:13px;font-weight:700}
.add-btn:hover{border-color:var(--gold);color:var(--gold2)}
.sub-list{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.sub-list > .lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sub-item{display:flex;gap:10px;align-items:end;margin-bottom:10px}
.sub-item .grow{flex:1}
.banner{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:rgba(198,166,107,.08);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--gold2);margin-bottom:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:color-mix(in srgb,var(--err) 45%,transparent);color:var(--err);background:rgba(233,115,102,.07)}
.actionbar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(11,11,12,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.actionbar-in{max-width:1180px;margin:auto;padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{font-size:12.5px;color:var(--muted);flex:1;min-width:180px}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}
.loadfile{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);font-size:13px}
.loadfile input{margin-top:12px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <img class="logo" src="../assets/logo-dark.jpg" alt="XARV logo">
    <h1>XARV Admin</h1>
    <p>Your private editing panel. Everything on the site is editable here.</p>
    <div class="fld"><label for="user">Username</label><input id="user" autocomplete="username" required></div>
    <div class="fld"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <button class="btn gold" type="submit" style="width:100%" id="loginBtn">Log in</button>
    <p class="login-err" id="loginErr"></p>
    <p class="login-note">Set up or change this login in Vercel → Settings → Environment Variables (ADMIN_USERNAME / ADMIN_PASSWORD). See DEPLOY-ADMIN.txt.</p>
  </form>
</div>

<!-- EDITOR -->
<div id="editorView" hidden>
  <div class="topbar">
    <div class="topbar-in">
      <span class="wm">XARV ADMIN</span>
      <span class="dot" id="dirtyDot">All changes saved</span>
      <span class="spacer"></span>
      <a class="btn sm" href="../index.html" target="_blank" rel="noopener">View site ↗</a>
      <button class="btn sm" id="logoutBtn">Log out</button>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="pane" id="pane"></div>
  <div class="actionbar">
    <div class="actionbar-in">
      <span class="status" id="status">—</span>
      <button class="btn sm" id="previewBtn">Preview draft</button>
      <button class="btn sm" id="clearDraftBtn">Clear preview</button>
      <button class="btn sm" id="downloadBtn">Download content.json</button>
      <button class="btn gold sm" id="publishBtn">Publish to my website</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };

  var D = null;            // working copy of content.json
  var USER = "", PASS = "";
  var ONLINE = true;       // false when /api/save is unreachable (local file etc.)
  var TAB = "general";

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function getP(o, p) { return p.split(".").reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
  function setP(o, p, v) { var ks = p.split("."); var c = o; for (var i = 0; i < ks.length - 1; i++) { if (c[ks[i]] == null) c[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; c = c[ks[i]]; } c[ks[ks.length - 1]] = v; }
  function status(msg, cls) { var s = $("#status"); s.textContent = msg; s.className = "status " + (cls || ""); }
  function dirty() { $("#dirtyDot").textContent = "● Unsaved changes"; $("#dirtyDot").className = "dot dirty"; }
  function clean() { $("#dirtyDot").textContent = "All changes saved"; $("#dirtyDot").className = "dot"; }

  /* ---------- field builders (return HTML) ---------- */
  function fld(label, inner, hint) {
    return '<div class="fld"><label>' + esc(label) + "</label>" + inner +
      (hint ? '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">' + esc(hint) + "</div>" : "") + "</div>";
  }
  function fS(path, label, opts) {
    opts = opts || {};
    var v = getP(D, path);
    var input = opts.ta
      ? '<textarea data-bind="' + path + '">' + esc(v) + "</textarea>"
      : '<input data-bind="' + path + '" value="' + esc(v) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : "") + ">";
    return fld(label, input, opts.hint);
  }
  function fN(path, label) {
    var v = getP(D, path);
    return fld(label, '<input type="number" min="1" max="5" data-bind="' + path + '" data-type="number" value="' + esc(v) + '">');
  }
  function fC(path, label) {
    var v = getP(D, path) || "#000000";
    return fld(label, '<input type="color" data-bind="' + path + '" value="' + esc(v) + '" style="height:44px;padding:4px;cursor:pointer">');
  }
  function fBool(path, label) {
    var v = !!getP(D, path);
    return '<div class="fld"><label style="text-transform:none;letter-spacing:0;font-size:13.5px;display:flex;gap:10px;align-items:center;color:var(--paper);cursor:pointer"><input type="checkbox" data-bind="' + path + '"' + (v ? " checked" : "") + ' style="width:18px;height:18px;accent-color:#c6a66b;flex-shrink:0"> ' + esc(label) + "</label></div>";
  }
  function fBi(path, label, opts) {
    opts = opts || {};
    var en = getP(D, path + ".en"), ar = getP(D, path + ".ar");
    var enI = opts.ta ? '<textarea data-bind="' + path + '.en">' + esc(en) + "</textarea>" : '<input data-bind="' + path + '.en" value="' + esc(en) + '"' + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : "") + ">";
    var arI = opts.ta ? '<textarea dir="rtl" data-bind="' + path + '.ar">' + esc(ar) + "</textarea>" : '<input dir="rtl" data-bind="' + path + '.ar" value="' + esc(ar) + '">';
    return fld(label, '<div class="ar-row"><div class="col-l"><span class="tag">EN</span>' + enI + '</div><div class="col-l"><span class="tag">AR</span>' + arI + "</div></div>", opts.hint);
  }

  /* ---------- list editor ---------- */
  function itemTitle(it, fields) {
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      if (f.k == null) { if (it.en) return it.en; }
      else if (f.bi && it[f.k] && it[f.k].en) return it[f.k].en;
      else if (!f.bi && it[f.k]) return String(it[f.k]);
    }
    return "Item";
  }
  function fieldHtml(base, it, f) {
    if (f.k == null) {
      return '<div class="ar-row">' +
        '<div class="col-l"><span class="tag">EN</span>' + (f.ta ? '<textarea data-bind="' + base + '.en">' + esc(it.en) + "</textarea>" : '<input data-bind="' + base + '.en" value="' + esc(it.en) + '">') + "</div>" +
        '<div class="col-l"><span class="tag">AR</span>' + (f.ta ? '<textarea dir="rtl" data-bind="' + base + '.ar">' + esc(it.ar) + "</textarea>" : '<input dir="rtl" data-bind="' + base + '.ar" value="' + esc(it.ar) + '">') + "</div></div>";
    }
    var p = base + "." + f.k;
    if (f.bi) return fBi(p, f.label || f.k, { ta: f.ta, ph: f.ph, hint: f.hint });
    if (f.type === "number") return fN(p, f.label || f.k);
    return fS(p, f.label || f.k, { ta: f.ta, ph: f.ph, hint: f.hint });
  }
  function fList(path, label, fields, opts) {
    opts = opts || {};
    var items = getP(D, path) || [];
    var html = '<div class="sec"><h2>' + esc(label) + "</h2>" + (opts.hint ? '<p class="hint">' + esc(opts.hint) + "</p>" : "");
    items.forEach(function (it, i) {
      var base = path + "." + i;
      html += '<div class="item"><div class="item-head"><span class="t">' + (i + 1) + ". " + esc(itemTitle(it, fields)) + "</span>" +
        '<span class="acts">' +
        '<button class="mini" data-act="up" data-path="' + path + '" data-i="' + i + '" title="Move up">↑</button>' +
        '<button class="mini" data-act="down" data-path="' + path + '" data-i="' + i + '" title="Move down">↓</button>' +
        '<button class="mini danger" data-act="del" data-path="' + path + '" data-i="' + i + '" title="Delete">✕</button>' +
        "</span></div>";
      fields.forEach(function (f) { html += '<div class="fld">' + fieldHtml(base, it, f) + "</div>"; });
      if (opts.nested) {
        html += '<div class="sub-list"><div class="lbl">' + esc(opts.nested.label) + "</div>" + subList(path + "." + i + "." + opts.nested.key, opts.nested.fields) + "</div>";
      }
      html += "</div>";
    });
    html += '<button class="add-btn" data-act="add" data-path="' + path + '">+ ' + esc(opts.addLabel || "Add item") + "</button></div>";
    return html;
  }
  function subList(path, fields) {
    var items = getP(D, path) || [];
    var html = "";
    items.forEach(function (it, i) {
      var base = path + "." + i;
      html += '<div class="sub-item"><div class="grow">';
      fields.forEach(function (f) {
        if (f.bi) {
          html += '<div class="ar-row" style="margin-bottom:8px"><div class="col-l"><span class="tag">EN</span><input data-bind="' + base + "." + f.k + '.en" value="' + esc(getP(D, base + "." + f.k + ".en")) + '"></div><div class="col-l"><span class="tag">AR</span><input dir="rtl" data-bind="' + base + "." + f.k + '.ar" value="' + esc(getP(D, base + "." + f.k + ".ar")) + '"></div></div>';
        } else {
          html += '<input style="margin-bottom:8px" data-bind="' + base + "." + f.k + '" value="' + esc(getP(D, base + "." + f.k)) + '" placeholder="' + esc(f.label || f.k) + '">';
        }
      });
      html += '</div><button class="mini danger" data-act="del" data-path="' + path + '" data-i="' + i + '" title="Delete">✕</button></div>';
    });
    html += '<button class="add-btn" data-act="add" data-path="' + path + '">+ Add</button>';
    return html;
  }
  function sec(title, hint, inner) {
    return '<div class="sec"><h2>' + esc(title) + "</h2>" + (hint ? '<p class="hint">' + esc(hint) + "</p>" : "") + inner + "</div>";
  }

  /* ---------- tabs ---------- */
  var TABS = [
    ["general", "General"],
    ["hero", "Hero"],
    ["services", "Services"],
    ["cases", "Case studies"],
    ["reviews", "Reviews"],
    ["process", "Process"],
    ["about", "About"],
    ["faq", "FAQ"],
    ["pages", "Pages"],
    ["seo", "SEO"],
    ["labels", "Labels & buttons"],
    ["theme", "Theme"]
  ];

  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(function (t) {
      return '<button class="tab' + (t[0] === TAB ? " on" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
    }).join("");
  }

  function renderPane() {
    var h = "";
    if (TAB === "general") {
      h += sec("Brand & contact", "Used across the whole site — buttons, footer, WhatsApp checkout, search engines.",
        '<div class="grid2">' + fS("brand", "Brand name") + fS("meta.founder", "Founder name") + "</div>" +
        '<div class="grid2">' + fS("meta.email", "Email") + fS("meta.phoneDigits", "WhatsApp digits", { hint: "Digits only, country code first, no + or spaces (e.g. 96181191013)." }) + "</div>" +
        '<div class="grid2">' + fS("meta.phoneDisplay", "Phone (display)") + fS("meta.instagram", "Instagram URL", { ph: "https://instagram.com/... — empty hides the link" }) + "</div>" +
        fBi("meta.promise", "Reply promise phrase", { hint: "Shown wherever the site says how fast you reply — e.g. “within minutes”." }) +
        '<div class="grid2">' + fS("meta.city", "City") + fS("meta.country", "Country") + "</div>");
      h += sec("Site URL & analytics", "Site URL feeds share links, sitemap data and search-engine cards. GA4 ID enables Google Analytics; empty means no tracking.",
        '<div class="grid2">' + fS("meta.siteUrl", "Site URL", { ph: "https://xarv.vercel.app" }) + fS("meta.gaId", "Google Analytics ID", { ph: "G-XXXXXXXXXX — empty = off" }) + "</div>");
      h += sec("Images", "Paths inside the assets folder (or full URLs). Logos swap automatically with the visitor's device theme.",
        '<div class="grid2">' + fS("assets.logoLight", "Logo — light theme") + fS("assets.logoDark", "Logo — dark theme") + "</div>" +
        '<div class="grid2">' + fS("assets.portrait", "Portrait photo") + fS("assets.ogCover", "Link-preview cover") + "</div>" +
        fS("assets.portraitAlt", "Portrait alt text (for search engines)"));
    }
    if (TAB === "hero") {
      h += sec("Top of the homepage", "The first thing visitors see. The middle word shows as an outline.",
        fBi("hero.eyebrow", "Eyebrow line") +
        '<div class="grid3">' + fBi("hero.word1", "Word 1") + fBi("hero.word2", "Word 2 (outline)") + fBi("hero.word3", "Word 3") + "</div>" +
        fBi("hero.lead", "Intro paragraph", { ta: true }) +
        '<div class="grid2">' + fBi("hero.ctaWork", "Button — primary") + fBi("hero.ctaWa", "Button — WhatsApp") + "</div>" +
        '<div class="grid2">' + fBi("hero.badge", "Badge on photo") + fBi("hero.badgeSub", "Badge sub-line") + "</div>" +
        '<div class="grid2">' + fBi("hero.promise", "Reply promise chip", { hint: "Use {promise} where the promise phrase goes (set in the General tab)." }) + fBi("hero.scrollNote", "Scroll hint") + "</div>");
    }
    if (TAB === "services") {
      h += sec("Section heading", "", fS("services.num", "Section number") + fBi("services.label", "Small label (e.g. SERVICES)") + fBi("services.title", "Heading") + fBi("services.intro", "Intro", { ta: true }));
      h += fList("services.items", "Service items", [
        { k: "title", bi: true },
        { k: "desc", bi: true, ta: true, label: "Description" },
        { k: "price", label: "Price", ph: "$99 — leave empty to show no price" },
        { k: "image", label: "Photo", ph: "assets/photo.jpg — leave empty for the gold letter tile" },
        { k: "alt", label: "Photo description (alt text)", ph: "Describe the photo for search engines" }
      ], { hint: "Each item gets an “Add to cart” and a “WhatsApp now” button automatically.", addLabel: "Add service" });
    }
    if (TAB === "cases") {
      h += sec("Section heading", "", fS("cases.num", "Section number") + fBi("cases.label", "Small label") + fBi("cases.title", "Heading") + fBi("cases.intro", "Intro", { ta: true }));
      h += sec("Row labels", "", '<div class="grid3">' + fBi("cases.labels.problem", "Problem label") + fBi("cases.labels.solution", "Solution label") + fBi("cases.labels.result", "Result label") + "</div>");
      h += fList("cases.items", "Case studies", [
        { k: "tag", bi: true, label: "Tag", ph: "Beauty · Beirut" },
        { k: "title", bi: true },
        { k: "problem", bi: true, ta: true },
        { k: "solution", bi: true, ta: true },
        { k: "result", bi: true, ta: true }
      ], { addLabel: "Add case study", nested: { key: "stats", label: "Stat chips", fields: [{ k: "v", label: "Value (+38%)" }, { k: "l", bi: true, label: "Label" }] } });
    }
    if (TAB === "reviews") {
      h += sec("Section heading", "", fS("reviews.num", "Section number") + fBi("reviews.label", "Small label") + fBi("reviews.title", "Heading") + fBi("reviews.intro", "Intro", { ta: true }));
      h += fList("reviews.items", "Reviews", [
        { k: "rating", type: "number", label: "Stars (1–5)" },
        { k: "text", bi: true, ta: true, label: "Review text" },
        { k: "author", bi: true, label: "Author" },
        { k: "detail", bi: true, label: "Detail (city, business)" }
      ], { hint: "These also power the star ratings search engines can show.", addLabel: "Add review" });
    }
    if (TAB === "process") {
      h += sec("Section heading", "", fS("process.num", "Section number") + fBi("process.label", "Small label") + fBi("process.title", "Heading") + fBi("process.intro", "Intro", { ta: true }));
      h += fList("process.steps", "Steps", [{ k: "title", bi: true }, { k: "desc", bi: true, ta: true, label: "Description" }], { addLabel: "Add step" });

      h += fList("faq.items", "Questions", [{ k: "q", bi: true, label: "Question" }, { k: "a", bi: true, ta: true, label: "Answer" }], { hint: "These also feed the FAQ data search engines read.", addLabel: "Add question" });

      h += fList("pages.privacy.sections", "Privacy sections", [{ k: "h", bi: true, label: "Heading" }, { k: "p", bi: true, ta: true, label: "Text" }], { addLabel: "Add section" });
      h += sec("Thank-you page", "Shown after a cart checkout.", fS("pages.thankyou.code", "Big symbol (✓)") + fBi("pages.thankyou.crumb", "Breadcrumb") + fBi("pages.thankyou.h", "Title") + fBi("pages.thankyou.p", "Text", { ta: true }) + '<div class="grid2">' + fBi("pages.thankyou.b1", "Button 1") + fBi("pages.thankyou.b2", "Button 2") + "</div>");
      h += sec("404 page", "", fS("pages.notfound.code", "Big code") + fBi("pages.notfound.h", "Title") + fBi("pages.notfound.p", "Text", { ta: true }) + '<div class="grid2">' + fBi("pages.notfound.b1", "Button 1") + fBi("pages.notfound.b2", "Button 2") + "</div>");
    }
    if (TAB === "seo") {
      h += sec("Search titles & descriptions", "Each page gets its own title and description — what shows in Google and link previews.",
        sec("Home", "", fBi("seo.home.title", "Title") + fBi("seo.home.desc", "Description", { ta: true })) +
        sec("Privacy", "", fBi("seo.privacy.title", "Title") + fBi("seo.privacy.desc", "Description", { ta: true })) +
        sec("Thank you", "", fBi("seo.thankyou.title", "Title") + fBi("seo.thankyou.desc", "Description", { ta: true })) +
        sec("404", "", fBi("seo.notfound.title", "Title") + fBi("seo.notfound.desc", "Description", { ta: true })));

      h += sec("Menu", "", '<div class="grid2">' + fBi("nav.services", "Services") + fBi("nav.work", "Case studies") + fBi("nav.reviews", "Reviews") + fBi("nav.process", "Process") + fBi("nav.about", "About") + fBi("nav.faq", "FAQ") + "</div>" + fBi("nav.cta", "Menu button"));
      h += sec("Cart", "", fBi("cart.title", "Cart title") + fBi("cart.empty", "Empty message", { ta: true }) + '<div class="grid2">' + fBi("cart.addBtn", "Add to cart") + fBi("cart.addedBtn", "Added state") + fBi("cart.waBtn", "WhatsApp-now button") + fBi("cart.remove", "Remove") + "</div>" + fBi("cart.checkout", "Checkout button") + fBi("cart.note", "Note under checkout", { ta: true }) + fBi("cart.orderIntro", "First line of the WhatsApp order", { ta: true }));

      h += sec("Colors", "The two themes. Visitors see the one matching their device.",
        '<div class="grid3">' + fC("theme.bgDark", "Background — dark") + fC("theme.goldDark", "Gold — dark") + fC("theme.gold2Dark", "Bright gold — dark") + "</div>" +
        '<div class="grid3">' + fC("theme.bgLight", "Background — light") + fC("theme.goldLight", "Gold — light") + fC("theme.gold2Light", "Deep gold — light") + "</div>");
      h += sec("Features", "Turn whole site features on or off.",

  /* ---------- new-item templates ---------- */
  function bi() { return { en: "", ar: "" }; }
  function newItem(path) {
    var key = path.replace(/\.\d+/g, "");
    var id = Date.now().toString(36);
    if (key === "services.items") return { id: "s" + id, title: bi(), desc: bi(), price: "", image: "", alt: "" };
    if (key === "cases.items") return { id: "cs" + id, tag: bi(), title: bi(), problem: bi(), solution: bi(), result: bi(), stats: [] };
    if (key === "cases.items.stats") return { v: "", l: bi() };
    if (key === "reviews.items") return { id: "r" + id, rating: 5, text: bi(), author: bi(), detail: bi() };
    if (key === "process.steps") return { title: bi(), desc: bi() };
    if (key === "faq.items") return { id: "f" + id, q: bi(), a: bi() };
    if (key === "about.stats") return { v: bi(), l: bi() };
    if (key === "about.facts") return { label: bi(), value: bi() };
    if (key === "pages.privacy.sections") return { h: bi(), p: bi() };
    return bi();
  }

  /* ---------- events ---------- */
  $("#tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (b) { TAB = b.getAttribute("data-tab"); renderTabs(); renderPane(); }
  });
  $("#pane").addEventListener("input", function (e) {
    var el = e.target.closest("[data-bind]");
    if (!el) return;
    var v = el.type === "checkbox" ? el.checked : el.value;
    if (el.getAttribute("data-type") === "number") v = parseInt(v, 10) || 0;
    setP(D, el.getAttribute("data-bind"), v);
    dirty();
    status("Unsaved changes", "");
  });
  $("#pane").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var path = b.getAttribute("data-path");
    var arr = getP(D, path) || [];
    var act = b.getAttribute("data-act");
    var i = parseInt(b.getAttribute("data-i"), 10);
    if (act === "add") { arr.push(newItem(path)); setP(D, path, arr); }
    if (act === "del") { if (!confirm("Delete this item?")) return; arr.splice(i, 1); }
    if (act === "up" && i > 0) { var t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; }
    if (act === "down" && i < arr.length - 1) { var t2 = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = t2; }
    dirty();
    renderPane();
  });

  /* ---------- actions ---------- */
  function creds() { return { username: USER, password: PASS }; }
  $("#previewBtn").addEventListener("click", function () {
    try { localStorage.setItem("xarv-admin-draft", JSON.stringify(D)); } catch (e) {}
    window.open("../index.html", "_blank");
    status("Draft opened in a new tab — only YOUR browser shows it. Publish to make it live for everyone.", "ok");
  });
  $("#clearDraftBtn").addEventListener("click", function () {
    try { localStorage.removeItem("xarv-admin-draft"); } catch (e) {}
    status("Preview cleared. Your browser shows the published site again.", "ok");
  });
  $("#downloadBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "content.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    status("Downloaded content.json — upload it to GitHub over the old one to publish manually.", "ok");
  });
  $("#publishBtn").addEventListener("click", async function () {
    if (!ONLINE) { status("Publish is not available on this server. Use Download content.json and upload it to GitHub.", "err"); return; }
    var btn = $("#publishBtn");
    btn.disabled = true;
    status("Publishing…", "");
    try {
      var res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: USER, password: PASS, content: D })
      });
      var out = await res.json().catch(function () { return {}; });
      if (res.ok) {
        try { localStorage.removeItem("xarv-admin-draft"); } catch (e) {}
        clean();
        status("Published ✓ Live for everyone in ~30 seconds — then hard-refresh the site (Ctrl+Shift+R).", "ok");
      } else {
        status(out.error || "Publish failed.", "err");
      }
    } catch (e) {
      status("Publish is not available on this server. Use Download content.json and upload it to GitHub.", "err");
    }
    btn.disabled = false;
  });
  $("#logoutBtn").addEventListener("click", function () {
    try { sessionStorage.removeItem("xarv-admin"); } catch (e) {}
    location.reload();
  });

  /* ---------- boot ---------- */
  function enterEditor() {
    $("#loginView").hidden = true;
    $("#editorView").hidden = false;
    renderTabs();
    if (D) { renderPane(); }
    else { $("#pane").innerHTML = '<div class="loadfile">Could not load content.json automatically.<br>If you opened this file from your computer, pick content.json manually — or open this page on your live site.<br><input type="file" id="fileLoad" accept="application/json"></div>';
      $("#fileLoad").addEventListener("change", function (e) {
        var f = e.target.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function () { try { D = JSON.parse(r.result); renderPane(); status("Loaded " + f.name, "ok"); } catch (err) { status("That file is not valid content.json", "err"); } };
        r.readAsText(f);
      });
    }
    var draft = null;
    try { draft = localStorage.getItem("xarv-admin-draft"); } catch (e) {}
    if (draft && D) {
      $("#pane").insertAdjacentHTML("afterbegin", '<div class="banner">You have an unpublished draft in this browser. <button class="btn sm" id="resumeDraft">Resume draft</button> <button class="btn sm" id="discardDraft">Discard draft</button></div>');
      $("#resumeDraft").addEventListener("click", function () { try { D = JSON.parse(draft); } catch (e) {} renderPane(); dirty(); });
      $("#discardDraft").addEventListener("click", function () { try { localStorage.removeItem("xarv-admin-draft"); } catch (e) {} renderPane(); });
    }
    if (!ONLINE) {
      $("#pane").insertAdjacentHTML("afterbegin", '<div class="banner warn">No publish server here (opened from a file, or api/ not deployed yet). You can still edit and use "Download content.json".</div>');
      $("#publishBtn").disabled = true;
    }
  }

  async function boot() {
    try {
      var r = await fetch("../content.json", { cache: "no-store" });
      if (r.ok) { var j = await r.json(); if (j && typeof j === "object") D = j; }
    } catch (e) {}
    if (!D) {
      try { var dr = localStorage.getItem("xarv-admin-draft"); if (dr) D = JSON.parse(dr); } catch (e) {}
    }
    var saved = null;
    try { saved = sessionStorage.getItem("xarv-admin"); } catch (e) {}
    if (saved) {
      var parts = saved.split("\n");
      USER = parts[0]; PASS = parts.slice(1).join("\n");
      enterEditor();
    }
  }

  $("#loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var u = $("#user").value.trim(), p = $("#pass").value;
    $("#loginErr").textContent = "";
    $("#loginBtn").disabled = true;
    try {
      var res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p, verifyOnly: true })
      });
      var out = await res.json().catch(function () { return null; });
      if (out == null) throw new Error("offline");
      if (res.ok) {
        USER = u; PASS = p;
        try { sessionStorage.setItem("xarv-admin", u + "\n" + p); } catch (e2) {}
        enterEditor();
      } else {
        $("#loginErr").textContent = out.error || "Login failed.";
      }
    } catch (err) {
      ONLINE = false;
      USER = u; PASS = p;
      try { sessionStorage.setItem("xarv-admin", u + "\n" + p); } catch (e2) {}
      enterEditor();
    }
    $("#loginBtn").disabled = false;
  });

  boot();
})();
</script>
