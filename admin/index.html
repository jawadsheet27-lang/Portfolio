<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site admin &middot; Jawad Sheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b0b0c'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' font-weight='bold' fill='%23c6a66b' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{--ink:#0b0b0c;--ink2:#141416;--ink3:#1c1c20;--paper:#f2eee7;--gold:#c6a66b;--gold2:#e4d0a2;--muted:#a29e97;--line:rgba(255,255,255,.14);--ok:#4ecb8b;--bad:#ff6b6b}
html,body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:600;margin:0}
a{color:var(--gold2)}
button{font:inherit;cursor:pointer}
/* ---------- login ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:34px}
.card h1{font-size:26px;letter-spacing:.01em}
.card p{color:var(--muted);font-size:14px}
.lbl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px}
input,textarea,select{width:100%;background:#0f0f11;border:1px solid var(--line);color:var(--paper);border-radius:10px;padding:12px 13px;font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:12px 22px;font-size:14px;font-weight:600;letter-spacing:.02em;transition:.18s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#151208}
.btn.gold:hover{background:var(--gold2);color:#151208}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.msg{margin-top:16px;font-size:13.5px;padding:11px 13px;border-radius:10px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(255,107,107,.12);color:#ffb3b3;border:1px solid rgba(255,107,107,.35)}
.msg.ok{background:rgba(78,203,139,.1);color:#a8e9c6;border:1px solid rgba(78,203,139,.3)}
.msg.warn{background:rgba(198,166,107,.1);color:var(--gold2);border:1px solid rgba(198,166,107,.32)}
/* ---------- shell ---------- */
.shell{display:none;min-height:100vh}
.shell.on{display:block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .name{font-weight:800;letter-spacing:.16em;font-size:13px}
.top .name i{color:var(--gold);font-style:normal}
.spacer{flex:1}
.wrap{display:grid;grid-template-columns:214px 1fr;gap:0;align-items:start}
.side{position:sticky;top:63px;padding:22px 12px;border-right:1px solid var(--line);min-height:calc(100vh - 63px)}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:10px 13px;border-radius:9px;font-size:14px}
.side button:hover{color:var(--paper);background:var(--ink2)}
.side button.on{background:var(--ink3);color:var(--gold2);font-weight:600}
.main{padding:28px 30px 90px;max-width:920px}
.panel{display:none}
.panel.on{display:block}
.panel>h2{font-size:24px;margin-bottom:4px}
.panel>.hint{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.field{margin-bottom:18px}
.field .lbl{margin-top:0}
.field .note{color:var(--muted);font-size:12.5px;margin-top:6px}
.item{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;background:var(--ink2)}
.item-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.item-top b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.thumb{display:flex;align-items:center;gap:14px;margin-top:8px}
.thumb img{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#000;border:1px solid var(--line)}
.file{position:relative;overflow:hidden;display:inline-block}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 22px;background:rgba(11,11,12,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .state{font-size:13px;color:var(--muted)}
.pill{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.pill.live{border-color:rgba(78,203,139,.5);color:#a8e9c6}
.pill.off{border-color:rgba(198,166,107,.5);color:var(--gold2)}
@media(max-width:780px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;min-height:0;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px}
  .side button{white-space:nowrap;width:auto}
  .main{padding:22px 18px 210px}
  .row2{grid-template-columns:1fr}
  .bar{padding:11px 14px;gap:10px;background:#0b0b0c}
  .bar .btn{flex:1 1 auto;justify-content:center;text-align:center}
  .bar .state{width:100%;order:3;text-align:center}
  .top{padding:11px 14px;gap:10px}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="gate" id="gate">
  <div class="card">
    <h1>Site admin</h1>
    <p>Edit your portfolio and publish it live.</p>
    <label class="lbl" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••">
    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn gold" id="loginBtn">Enter</button>
      <button class="btn" id="offlineBtn">Open without publishing</button>
    </div>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<!-- ===================== EDITOR ===================== -->
<div class="shell" id="shell">
  <div class="top">
    <div class="name">JAWAD SHEET <i>/ admin</i></div>
    <span class="pill" id="modePill">checking…</span>
    <div class="spacer"></div>
    <a class="btn sm" href="../" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn sm" id="logoutBtn">Log out</button>
  </div>

  <div class="wrap">
    <nav class="side" id="side"></nav>
    <div class="main" id="main"></div>
  </div>

  <div class="bar">
    <button class="btn gold" id="publishBtn">Publish to my website</button>
    <button class="btn sm" id="downloadBtn">Download content.json</button>
    <button class="btn sm danger" id="resetBtn">Undo all my changes</button>
    <span class="state" id="state"></span>
  </div>
</div>

<script>
(function(){
'use strict';

var API = '../api/save';
var DRAFT = 'jawad-admin-draft-v1';
var data = null, original = null, password = '', canPublish = false;
var UPLOADS = [];           /* [{path, base64, mime}] */
var PREVIEW = {};           /* path -> local dataURL, so you see it before publishing */
var activeSection = 'hero';

/* ---------- tiny helpers ---------- */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function get(path){
  return path.split('.').reduce(function(o,k){ return (o == null) ? undefined : o[k]; }, data);
}
function set(path, val){
  var parts = path.split('.'), last = parts.pop();
  var o = parts.reduce(function(o,k){ if(o[k] == null) o[k] = {}; return o[k]; }, data);
  o[last] = val;
}
function say(txt, kind){
  var s = el('state');
  s.textContent = txt || '';
  s.style.color = kind === 'err' ? '#ffb3b3' : (kind === 'ok' ? '#a8e9c6' : '');
}
function gateMsg(txt, kind){
  var m = el('gateMsg');
  m.className = 'msg show ' + (kind || 'err');
  m.innerHTML = txt;
}
function imgSrc(p){
  if(!p) return '';
  if(PREVIEW[p]) return PREVIEW[p];
  if(/^(https?:|data:)/.test(p)) return p;
  return '../' + p;
}
var draftTimer = null;
function touch(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function(){
    try{ localStorage.setItem(DRAFT, JSON.stringify({content:data, uploads:UPLOADS})); }catch(e){}
  }, 400);
  say('Unsaved changes — press Publish when you are ready.');
}

/* ---------- the form description ---------- */
var SECTIONS = [
  {id:'hero', label:'Top of page', title:'Top of the page',
   hint:'The logo text, the three big words, your intro line and your photo.',
   fields:[
     ['brand','Logo text (top left corner)','text'],
     ['hero.eyebrow','Small line above the big words','text'],
     ['hero.word1','Big word 1','text'],
     ['hero.word2','Big word 2 (the outlined one)','text'],
     ['hero.word3','Big word 3','text'],
     ['hero.lead','Intro paragraph','area'],
     ['hero.badge','Green badge text','text'],
     ['hero.badgeSub','Badge second line','text'],
     ['profileImage','Your photo','image']
   ]},
  {id:'services', label:'01 Services', title:'Services',
   hint:'What you offer. Add or remove as many as you like — they renumber themselves.',
   fields:[['services.title','Section headline','text'],['services.intro','Section intro','area']],
   list:{path:'services.items', label:'Service', add:{title:'New service', desc:'Describe it here.'},
     fields:[['title','Name','text'],['desc','Description','area']]}},
  {id:'work', label:'02 Work', title:'Selected work',
   hint:'Your projects. "Card style" picks how the picture area looks — use "Photo on light background" for logos and "Photo, dark and moody" for product shots.',
   fields:[['work.title','Section headline','text'],['work.intro','Section intro','area']],
   list:{path:'projects', label:'Project',
     add:{visual:'light', bg:'#ffffff', image:'', alt:'', mark:'', title:'New project', desc:'What it is and what you made.', kind:'Design'},
     fields:[
       ['title','Project name','text'],
       ['desc','Description','area'],
       ['kind','Small label (e.g. Logo design)','text'],
       ['visual','Card style','select', [
         ['light','Photo on light background'],
         ['shot','Photo, dark and moody'],
         ['vanta','Art card: sport lines'],
         ['umbra','Art card: sunglasses'],
         ['nova','Art card: glowing orb']
       ]],
       ['image','Picture','image'],
       ['bg','Background colour behind the picture','color'],
       ['mark','Word printed on the card (art cards only)','text'],
       ['alt','Photo description for accessibility','text']
     ]}},
  {id:'motion', label:'03 Motion', title:'Motion — the video row',
   hint:'Short videos of your work. Keep each one under about 4 MB, otherwise upload it by hand into the assets folder.',
   fields:[['motion.title','Section headline','text'],['motion.intro','Section intro','area']],
   list:{path:'reels', label:'Video',
     add:{src:'', poster:'', ratio:'9/16', title:'', cap:'New video', sub:'Short description'},
     fields:[
       ['cap','Title on the card','text'],
       ['sub','Small line under the title','text'],
       ['src','Video file','video'],
       ['poster','Still image shown before it plays','image'],
       ['ratio','Shape','select', [['9/16','Tall phone video'],['25/22','Almost square'],['29/52','Very tall'],['16/9','Wide screen']]],
       ['title','Description for accessibility','text']
     ]}},
  {id:'process', label:'04 Process', title:'Process',
   hint:'The steps you take a client through.',
   fields:[['process.title','Section headline','text'],['process.intro','Section intro','area']],
   list:{path:'process.steps', label:'Step', add:{title:'New step', desc:'What happens here.'},
     fields:[['title','Step name','text'],['desc','What happens','area']]}},
  {id:'about', label:'05 About', title:'About you',
   hint:'Your bio, the three counting numbers and the four quick facts.',
   fields:[['about.quote','Big quote line','text'],['about.copy','Your bio','area']],
   lists:[
     {path:'about.stats', label:'Number', add:{value:'0', suffix:'', label:'New number'},
      fields:[['value','Number','text'],['suffix','Letter after it (like h)','text'],['label','What it means','text']]},
     {path:'about.facts', label:'Fact', add:{label:'New fact', value:'Details'},
      fields:[['label','Fact name','text'],['value','Fact value','text']]}
   ]},
  {id:'contact', label:'Contact', title:'Contact block & your details',
   hint:'Change your email or number here once and every button, link and the printed CV update together.',
   fields:[
     ['cta.eyebrow','Small line above the big invite','text'],
     ['cta.title','Big invite headline (put *stars* around a word to make it italic gold)','text'],
     ['cta.text','Invite paragraph','area'],
     ['contact.email','Email address','text'],
     ['contact.phoneDigits','WhatsApp / phone, digits only with country code','text'],
     ['contact.phoneDisplay','How the number is written on the CV','text'],
     ['contact.linkedin','LinkedIn address','text'],
     ['contact.location','City shown in the footer','text']
   ]},
  {id:'extras', label:'Scrolling words', title:'The scrolling word strip',
   hint:'The gold words that slide across under the first screen.',
   fields:[],
   list:{path:'marquee', label:'Word', plain:true, add:'New word', fields:[]}}
];

/* ---------- rendering ---------- */
function fieldHtml(f, value, ref){
  var key = f[0], label = f[1], type = f[2];
  var idAttr = 'data-ref="' + esc(ref) + '"';
  var h = '<div class="field"><label class="lbl">' + esc(label) + '</label>';
  if(type === 'area'){
    h += '<textarea ' + idAttr + '>' + esc(value) + '</textarea>';
  } else if(type === 'select'){
    h += '<select ' + idAttr + '>' + f[3].map(function(o){
      return '<option value="' + esc(o[0]) + '"' + (String(value) === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select>';
  } else if(type === 'color'){
    h += '<div style="display:flex;gap:10px;align-items:center">' +
         '<input type="color" ' + idAttr + ' value="' + esc(/^#[0-9a-fA-F]{6}$/.test(value) ? value : '#ffffff') + '" style="width:58px;height:44px;padding:4px">' +
         '<input type="text" data-mirror="' + esc(ref) + '" value="' + esc(value) + '" placeholder="#ffffff" style="max-width:160px">' +
         '</div>';
  } else if(type === 'image' || type === 'video'){
    var isImg = type === 'image';
    h += '<div class="thumb">';
    if(isImg){
      h += '<img src="' + esc(imgSrc(value)) + '" alt="" onerror="this.style.opacity=.15">';
    }
    h += '<div><span class="btn sm file">' + (isImg ? 'Choose a picture' : 'Choose a video') +
         '<input type="file" accept="' + (isImg ? 'image/*' : 'video/*') + '" data-upload="' + esc(ref) + '" data-kind="' + type + '"></span>' +
         '<div class="note" data-name="' + esc(ref) + '">' + (value ? esc(value) : 'nothing chosen yet') + '</div></div></div>';
    h += '<input type="hidden" ' + idAttr + ' value="' + esc(value) + '">';
  } else {
    h += '<input type="text" ' + idAttr + ' value="' + esc(value) + '">';
  }
  if(key === 'contact.phoneDigits') h += '<div class="note">Example: 96181191013 &mdash; no +, no spaces.</div>';
  return h + '</div>';
}

function listHtml(spec){
  var arr = get(spec.path) || [];
  var out = '<h3 style="font-size:18px;margin:26px 0 12px">' + esc(spec.label) + 's <span style="color:var(--muted);font-family:inherit;font-size:13px">(' + arr.length + ')</span></h3>';
  arr.forEach(function(item, i){
    out += '<div class="item"><div class="item-top"><b>' + esc(spec.label) + ' ' + (i + 1) + '</b>' +
      '<div class="spacer"></div>' +
      '<button class="btn sm" data-move="' + esc(spec.path) + '" data-i="' + i + '" data-d="-1" title="Move up" aria-label="Move up">↑</button>' +
      '<button class="btn sm" data-move="' + esc(spec.path) + '" data-i="' + i + '" data-d="1" title="Move down" aria-label="Move down">↓</button>' +
      '<button class="btn sm danger" data-del="' + esc(spec.path) + '" data-i="' + i + '">Remove</button></div>';
    if(spec.plain){
      out += fieldHtml(['v', spec.label, 'text'], item, spec.path + '.' + i);
    } else {
      spec.fields.forEach(function(f){
        out += fieldHtml(f, item[f[0]], spec.path + '.' + i + '.' + f[0]);
      });
    }
    out += '</div>';
  });
  out += '<button class="btn" data-add="' + esc(spec.path) + '">+ Add a ' + esc(spec.label).toLowerCase() + '</button>';
  return out;
}

function render(){
  el('side').innerHTML = SECTIONS.map(function(s){
    return '<button data-sec="' + s.id + '" class="' + (s.id === activeSection ? 'on' : '') + '">' + esc(s.label) + '</button>';
  }).join('');

  el('main').innerHTML = SECTIONS.map(function(s){
    var h = '<section class="panel ' + (s.id === activeSection ? 'on' : '') + '" data-panel="' + s.id + '">' +
      '<h2>' + esc(s.title) + '</h2><p class="hint">' + esc(s.hint) + '</p>';
    s.fields.forEach(function(f){ h += fieldHtml(f, get(f[0]), f[0]); });
    (s.list ? [s.list] : (s.lists || [])).forEach(function(spec){ h += listHtml(spec); });
    return h + '</section>';
  }).join('');
}

/* ---------- writing values back ---------- */
function writeRef(ref, value){
  var parts = ref.split('.');
  var idx = parts.findIndex(function(p){ return /^\d+$/.test(p); });
  if(idx === -1){ set(ref, value); return; }
  var arr = get(parts.slice(0, idx).join('.')) || [];
  var i = parseInt(parts[idx], 10);
  var rest = parts.slice(idx + 1);
  if(!rest.length) arr[i] = value; else arr[i][rest.join('.')] = value;
}

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.dataset && t.dataset.ref !== undefined && t.type !== 'file'){
    writeRef(t.dataset.ref, t.value);
    if(t.type === 'color'){
      var m = document.querySelector('[data-mirror="' + t.dataset.ref + '"]');
      if(m) m.value = t.value;
    }
    touch();
  }
  if(t.dataset && t.dataset.mirror !== undefined){
    writeRef(t.dataset.mirror, t.value);
    var c = document.querySelector('[data-ref="' + t.dataset.mirror + '"]');
    if(c && /^#[0-9a-fA-F]{6}$/.test(t.value)) c.value = t.value;
    touch();
  }
});

/* ---------- uploads ---------- */
function slug(name){
  return String(name).toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'file';
}
function shrinkImage(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1500, w = img.width, h = img.height;
        if(Math.max(w, h) > max){ var r = max / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function(){ res(fr.result); };
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function readRaw(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
document.addEventListener('change', async function(e){
  var t = e.target;
  if(!t.dataset || t.dataset.upload === undefined) return;
  var file = t.files && t.files[0];
  if(!file) return;
  var ref = t.dataset.upload, kind = t.dataset.kind;
  say('Preparing ' + file.name + '…');
  try{
    var dataUrl = kind === 'image' ? await shrinkImage(file) : await readRaw(file);
    var base64 = dataUrl.split(',')[1];
    var bytes = Math.round(base64.length * 0.75);
    if(bytes > 4.4 * 1024 * 1024){
      say('That file is ' + (bytes / 1048576).toFixed(1) + ' MB — too big to publish through this page. Put it in the assets folder by hand instead.', 'err');
      t.value = '';
      return;
    }
    var ext = kind === 'image' ? 'jpg' : (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g,'');
    var path = 'assets/uploads/' + slug(file.name) + '-' + Date.now().toString(36) + '.' + ext;
    UPLOADS = UPLOADS.filter(function(u){ return u.ref !== ref; });
    UPLOADS.push({ref:ref, path:path, base64:base64});
    PREVIEW[path] = dataUrl;
    writeRef(ref, path);
    var hidden = document.querySelector('[data-ref="' + ref + '"]');
    if(hidden) hidden.value = path;
    var nameNote = document.querySelector('[data-name="' + ref + '"]');
    if(nameNote) nameNote.textContent = path + '  (' + (bytes / 1024).toFixed(0) + ' KB)';
    var box = t.closest('.field');
    var prev = box && box.querySelector('img');
    if(prev){ prev.src = dataUrl; prev.style.opacity = 1; }
    touch();
    say('Ready to publish: ' + file.name, 'ok');
  }catch(err){
    say('Could not read that file: ' + err.message, 'err');
  }
});

/* ---------- clicks ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b) return;
  var d = b.dataset;
  if(d.sec){ activeSection = d.sec; render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  if(d.add !== undefined){
    var spec = null;
    SECTIONS.forEach(function(s){ (s.list ? [s.list] : (s.lists || [])).forEach(function(x){ if(x.path === d.add) spec = x; }); });
    var arr = get(d.add) || [];
    arr.push(typeof spec.add === 'string' ? spec.add : JSON.parse(JSON.stringify(spec.add)));
    set(d.add, arr); touch(); render(); return;
  }
  if(d.del !== undefined){
    var arr2 = get(d.del) || [];
    var label = typeof arr2[d.i] === 'string' ? arr2[d.i] : (arr2[d.i].title || arr2[d.i].cap || arr2[d.i].label || 'this one');
    if(!confirm('Remove "' + label + '" ?')) return;
    arr2.splice(parseInt(d.i, 10), 1); touch(); render(); return;
  }
  if(d.move !== undefined){
    var arr3 = get(d.move) || [], i = parseInt(d.i, 10), j = i + parseInt(d.d, 10);
    if(j < 0 || j >= arr3.length) return;
    var tmp = arr3[i]; arr3[i] = arr3[j]; arr3[j] = tmp;
    touch(); render(); return;
  }
});

/* ---------- login ---------- */
async function tryAuth(pw){
  var r = await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'auth', password:pw})
  });
  var j = null;
  try{ j = await r.json(); }catch(e){}
  return {status:r.status, body:j};
}
async function loadContent(){
  var r = await fetch('../content.json?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('content.json was not found next to index.html (status ' + r.status + ')');
  var j = await r.json();
  original = JSON.stringify(j);
  data = JSON.parse(original);
}
function offerDraft(){
  var raw = null;
  try{ raw = localStorage.getItem(DRAFT); }catch(e){}
  if(!raw) return;
  try{
    var saved = JSON.parse(raw);
    if(JSON.stringify(saved.content) === original) return;
    if(confirm('You have unpublished changes from last time in this browser. Load them?')){
      data = saved.content;
      UPLOADS = (saved.uploads || []).filter(function(u){ return u && u.path; });
      say('Unpublished changes restored. Press Publish to put them online.');
    } else {
      localStorage.removeItem(DRAFT);
    }
  }catch(e){}
}
async function start(publishAllowed){
  canPublish = publishAllowed;
  await loadContent();
  offerDraft();
  el('gate').style.display = 'none';
  el('shell').classList.add('on');
  var pill = el('modePill');
  if(canPublish){
    pill.className = 'pill live';
    pill.textContent = 'Publishing is on';
  } else {
    pill.className = 'pill off';
    pill.textContent = 'Download mode';
    el('publishBtn').style.display = 'none';
    say('No publish server connected. Edit freely, then use “Download content.json” and upload that one file to your host.');
  }
  render();
}

el('loginBtn').addEventListener('click', async function(){
  var pw = el('pw').value;
  if(!pw){ gateMsg('Type your password first.'); return; }
  el('loginBtn').textContent = 'Checking…';
  try{
    var res = await tryAuth(pw);
    if(res.status === 200 && res.body && res.body.ok){
      password = pw;
      await start(true);
    } else if(res.status === 401){
      gateMsg('Wrong password.');
    } else if(res.status === 404){
      gateMsg('This site has no publish server yet, so the password cannot be checked.<br>Open <b>DEPLOY-ADMIN.txt</b> and follow it once, or press <b>Open without publishing</b> to edit and download the file instead.', 'warn');
    } else {
      gateMsg((res.body && res.body.error) ? esc(res.body.error) : 'The server answered with status ' + res.status + '.');
    }
  }catch(err){
    gateMsg('Could not reach the server. If you opened this file straight from your computer, press <b>Open without publishing</b>.', 'warn');
  }
  el('loginBtn').textContent = 'Enter';
});
el('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') el('loginBtn').click(); });
el('offlineBtn').addEventListener('click', async function(){
  try{ await start(false); }
  catch(err){ gateMsg(esc(err.message)); }
});
el('logoutBtn').addEventListener('click', function(){ location.reload(); });

/* ---------- publish ---------- */
el('publishBtn').addEventListener('click', async function(){
  var btn = el('publishBtn');
  btn.disabled = true;
  btn.textContent = 'Publishing…';
  say('Sending your changes…');
  try{
    var r = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'save',
        password: password,
        content: data,
        uploads: UPLOADS.map(function(u){ return {path:u.path, base64:u.base64}; })
      })
    });
    var j = null;
    try{ j = await r.json(); }catch(e){}
    if(r.ok && j && j.ok){
      UPLOADS = [];
      original = JSON.stringify(data);
      try{ localStorage.removeItem(DRAFT); }catch(e){}
      say('Published. Your website updates itself in about 30 seconds — then refresh it with Ctrl+Shift+R.', 'ok');
    } else if(r.status === 401){
      say('Password rejected. Log out and try again.', 'err');
    } else {
      say('Publish failed: ' + ((j && j.error) ? j.error : 'server status ' + r.status), 'err');
    }
  }catch(err){
    say('Publish failed: ' + err.message, 'err');
  }
  btn.disabled = false;
  btn.textContent = 'Publish to my website';
});

el('downloadBtn').addEventListener('click', function(){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'content.json';
  a.click();
  URL.revokeObjectURL(a.href);
  var extra = UPLOADS.length ? ' Remember to also copy your ' + UPLOADS.length + ' new file(s) into the assets/uploads folder.' : '';
  say('content.json downloaded. Upload it next to index.html.' + extra, 'ok');
});

el('resetBtn').addEventListener('click', function(){
  if(!confirm('Throw away every change you made since your last publish?')) return;
  data = JSON.parse(original);
  UPLOADS = []; PREVIEW = {};
  try{ localStorage.removeItem(DRAFT); }catch(e){}
  render();
  say('Back to the published version.', 'ok');
});

window.addEventListener('beforeunload', function(e){
  if(JSON.stringify(data) !== original){ e.preventDefault(); e.returnValue = ''; }
});
})();
</script>
</body>
